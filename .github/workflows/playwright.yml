name: E2E Tests

# Runs the production critical-path suite on a GitHub-hosted runner, fully
# self-contained — deliberately NOT on the self-hosted VPS runner.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  e2e:
    name: Production Critical Path
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_app_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/school_app_test
      JWT_SECRET: ci-only-jwt-signing-key-not-used-anywhere-real
      REFRESH_TOKEN_SECRET: ci-only-refresh-signing-key-not-used-for-real
      NODE_ENV: development
      BACKEND_PORT: 5099
      VITE_API_URL: http://127.0.0.1:5099/api
      VITE_SOCKET_URL: http://127.0.0.1:5099

    steps:
      - uses: actions/checkout@v4

      - name: Align Prisma demo field before client generation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/prisma/schema.prisma')
          text = path.read_text()
          marker = '  is_active              Boolean                @default(true)\n'
          field = '  is_demo                Boolean                @default(false)\n'
          if field not in text:
              if marker not in text:
                  raise SystemExit('User.is_active marker not found in backend Prisma schema')
              text = text.replace(marker, marker + field, 1)
              path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Seed demo data
        run: npm run db:seed

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend and frontend preview
        run: |
          npx tsx backend/src/server.ts > /tmp/e2e-backend.log 2>&1 &
          npx vite preview --port 4173 --strictPort > /tmp/e2e-preview.log 2>&1 &
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$BACKEND_PORT/live" > /dev/null 2>&1; then
              echo "Backend healthy after $((i * 2))s"
              exit 0
            fi
            if [ "$i" = "60" ]; then
              echo "::error::Backend never became healthy — log:"
              cat /tmp/e2e-backend.log
              exit 1
            fi
            sleep 2
          done

      - name: Verify frontend/API wiring
        run: |
          echo "Backend:"
          curl -fsS "http://127.0.0.1:$BACKEND_PORT/live"
          echo
          echo "Frontend:"
          curl -fsSI "http://127.0.0.1:4173/"
          echo
          echo "Frontend API path:"
          curl -fsSI "http://127.0.0.1:4173/api/health" || true

      # Diagnostic only: never replaces or weakens the real critical-path gate.
      - name: Diagnose browser boot
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const events = [];
            page.on('console', m => events.push(`[console:${m.type()}] ${m.text()}`));
            page.on('pageerror', e => events.push(`[pageerror] ${e?.stack || e}`));
            page.on('requestfailed', r => events.push(`[requestfailed] ${r.method()} ${r.url()} :: ${r.failure()?.errorText || 'unknown'}`));
            page.on('response', r => {
              if (r.status() >= 400) events.push(`[response:${r.status()}] ${r.request().method()} ${r.url()}`);
            });
            let output = '';
            try {
              await page.goto('http://localhost:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(5000);
              const state = await page.evaluate(() => ({
                url: location.href,
                title: document.title,
                body: document.body?.innerText?.slice(0, 10000) || '',
                rootHtml: document.getElementById('root')?.innerHTML?.slice(0, 10000) || '',
                demoButtons: [...document.querySelectorAll('button')].map(b => b.innerText).filter(Boolean).filter(t => /demo/i.test(t)),
                sessionStorage: Object.fromEntries(Object.entries(sessionStorage)),
                localStorage: Object.fromEntries(Object.entries(localStorage)),
              }));
              output += 'BOOT_STATE=' + JSON.stringify(state, null, 2) + '\n';
              await page.screenshot({ path: '/tmp/boot.png', fullPage: true });
            } catch (e) {
              output += 'BOOT_GOTO_ERROR=' + (e?.stack || e) + '\n';
            }
            output += 'BOOT_EVENTS_BEGIN\n' + events.join('\n') + '\nBOOT_EVENTS_END\n';
            fs.writeFileSync('/tmp/boot-diagnostics.txt', output);
            await browser.close();
          })();
          NODE
          mkdir -p .playwright-results
          cp /tmp/boot-diagnostics.txt .playwright-results/boot-diagnostics.txt || true
          cp /tmp/boot.png .playwright-results/boot.png || true
          cat .playwright-results/boot-diagnostics.txt || true

      - name: Run critical path suite
        run: BASE_URL=http://localhost:4173 npx playwright test tests/e2e/production-critical-path.spec.ts --project=chromium --workers=1

      - name: Server logs on failure
        if: failure()
        run: |
          echo "::group::backend log (last 200 lines)"
          tail -200 /tmp/e2e-backend.log || true
          echo "::endgroup::"
          echo "::group::vite preview log (last 100 lines)"
          tail -100 /tmp/e2e-preview.log || true
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            .playwright-report/
            .playwright-results/
          retention-days: 30